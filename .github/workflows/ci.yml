name: CI

# Runs on every pull request and on main. "Python tests" and the HACS and hassfest
# validation are required checks: main only accepts changes through a pull request where they pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatting (ruff format)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy
      - name: Translations have the same keys
        run: python scripts/check_translations.py
      - name: Tests and fuzzing, with a coverage floor
        run: pytest

  card:
    name: Card
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - name: Unit tests (node:test)
        run: npm test
      - name: The committed bundle is built from this source
        run: npm run build && git diff --exit-code -- ../custom_components/dreame_vacuum_3d/frontend

  browser:
    name: Browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The card in the demo, in a browser (Playwright, software WebGL)
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            card/playwright-report/
            card/test-results/
          retention-days: 14
