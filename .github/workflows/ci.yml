name: CI

# Runs on every pull request and on main. "Python tests" and the HACS and hassfest
# validation are required checks: main only accepts changes through a pull request where they pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Translations have the same keys
        run: python scripts/check_translations.py
      - name: Tests and fuzzing, with a coverage floor
        run: pytest
