name: Site

# Publishes the landing page (site/) to GitHub Pages, with the live demo (card/demo/ and the committed card bundle)
# and the README's images (docs/images/) next to it: https://dortizesquivel.github.io/dreame-vacuum-3d/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Assemble the site
        run: |
          mkdir -p _site/card _site/custom_components/dreame_vacuum_3d _site/docs
          cp -r site/. _site/
          cp -r card/demo _site/card/
          cp -r custom_components/dreame_vacuum_3d/frontend _site/custom_components/dreame_vacuum_3d/
          cp -r docs/images _site/docs/
          rm -rf _site/card/demo/house   # a private house is git-ignored; never publish one
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # publish the site
      id-token: write    # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
