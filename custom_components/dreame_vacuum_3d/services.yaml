# Portions derived from Tasshack/dreame-vacuum (MIT), see NOTICE.
# Schemas and field names match Tasshack for Node-RED migration
# (dreame_vacuum.* → dreame_vacuum_3d.*).

vacuum_clean_segment:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    segments:
      example: "[3,2] or 3"
      required: true
      selector:
        object:
    repeats:
      example: "[1,2] or 1"
      required: false
      selector:
        number:
          min: 1
          max: 3
    suction_level:
      example: "[0,3] or 0"
      required: false
      selector:
        number:
          min: 0
          max: 3
    water_volume:
      example: "[1,3] or 1"
      required: false
      selector:
        number:
          min: 1
          max: 3

vacuum_clean_zone:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    zone:
      example: "[819,-263,4424,2105] or [[819,-263,4424,2105],[-2001,-3050,-542,515]]"
      required: true
      selector:
        object:
    repeats:
      example: "[1,2] or 1"
      required: false
      selector:
        number:
          min: 1
          max: 3
    suction_level:
      example: "[0,3] or 0"
      required: false
      selector:
        number:
          min: 0
          max: 3
    water_volume:
      example: "[1,3] or 1"
      required: false
      selector:
        number:
          min: 1
          max: 3

vacuum_clean_spot:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    points:
      example: "[819,-263] or [[819,-263],[819,-263]]"
      required: true
      selector:
        object:
    repeats:
      example: "[1,2] or 1"
      required: false
      selector:
        number:
          min: 1
          max: 3
    suction_level:
      example: "[0,3] or 0"
      required: false
      selector:
        number:
          min: 0
          max: 3
    water_volume:
      example: "[1,3] or 1"
      required: false
      selector:
        number:
          min: 1
          max: 3

vacuum_goto:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    x:
      example: 819
      required: true
      selector:
        number:
          mode: box
    y:
      example: -263
      required: true
      selector:
        number:
          mode: box

vacuum_remote_control_move_step:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    rotation:
      example: 64
      required: true
      selector:
        number:
          min: -360
          max: 360
          mode: box
    velocity:
      example: 100
      required: true
      selector:
        number:
          min: -600
          max: 600
          mode: box

vacuum_select_map:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    map_id:
      example: 14
      required: true
      selector:
        number:
          mode: box

vacuum_reset_consumable:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    consumable:
      required: true
      selector:
        select:
          options:
            - "main_brush"
            - "side_brush"
            - "filter"
            - "tank_filter"
            - "sensor"
            - "mop_pad"
            - "silver_ion"
            - "detergent"
            - "squeegee"
            - "onboard_dirty_water_tank"
            - "dirty_water_channel"
            - "deodorizer"
            - "wheel"
            - "scale_inhibitor"
            - "fluffing_roller"
            - "roller_mop_filter"
            - "water_outlet_filter"

vacuum_dock_action:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    action:
      required: true
      selector:
        select:
          translation_key: dock_action
          options:
            - "empty"
            - "wash"
            - "stop_washing"
            - "dry"
            - "stop_drying"

vacuum_request_map:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum

vacuum_start_fast_mapping:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum

vacuum_start_mapping:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum

vacuum_rename_segment:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    segment_id:
      example: "3"
      required: true
      selector:
        number:
          min: 1
          max: 63
          mode: box
    segment_name:
      example: "Playroom"
      required: true
      selector:
        text:

vacuum_set_cleaning_sequence:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    cleaning_sequence:
      example: "[5,3,2,1,4] or []"
      required: true
      selector:
        object:

vacuum_set_custom_cleaning:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    segment_id:
      example: "[1,2,3]"
      required: true
      selector:
        object:
    suction_level:
      example: "[0,2,3]"
      required: true
      selector:
        object:
    water_volume:
      example: "[1,2,3]"
      required: true
      selector:
        object:
    repeats:
      example: "[2,1,1]"
      required: true
      selector:
        object:

vacuum_rename_map:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    map_id:
      example: "14"
      required: true
      selector:
        number:
          mode: box
    map_name:
      example: "Ground Floor"
      required: true
      selector:
        text:

vacuum_delete_map:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    map_id:
      example: 14
      required: false
      selector:
        number:
          mode: box

vacuum_backup_map:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    map_id:
      example: 14
      required: false
      selector:
        number:
          mode: box

vacuum_restore_map:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    recovery_map_index:
      required: true
      selector:
        number:
          min: 1
          max: 4
          mode: box
    map_id:
      example: 14
      required: false
      selector:
        number:
          mode: box

vacuum_set_obstacle_ignore:
  target:
    entity:
      integration: dreame_vacuum_3d
      domain: vacuum
  fields:
    x:
      example: 819
      required: true
      selector:
        number:
          mode: box
    y:
      example: -263
      required: true
      selector:
        number:
          mode: box
    obstacle_ignored:
      example: "false"
      required: true
      selector:
        boolean:
