# Tooling only: the integration is installed by HACS (or copied by hand), not as a Python package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pytest-homeassistant-custom-component runs every test in Home Assistant's own event loop.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["custom_components/dreame_vacuum_3d"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
check_untyped_defs = true
files = ["custom_components/dreame_vacuum_3d"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# shortcut: Home Assistant 2026.10 annotates schemas as probatio; ours are voluptuous, which it still accepts.
# Move the schemas to probatio when Home Assistant stops accepting voluptuous.
module = [
    "custom_components.dreame_vacuum_3d.config_flow",
    "custom_components.dreame_vacuum_3d.vacuum",
    "custom_components.dreame_vacuum_3d.websocket",
]
disable_error_code = ["arg-type", "dict-item"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplifications
    "ASYNC",     # blocking calls in async code
    "S",         # bandit (security)
    "BLE",       # blind except
    "RUF",       # ruff's own
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; fixed fake tokens and coordinates aren't secrets.
"tests/**" = ["S101", "S105", "S106"]
# Helper scripts run fixed commands, print their results and set sys.path before importing the integration.
"scripts/**" = ["E402", "S603", "S607", "T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
